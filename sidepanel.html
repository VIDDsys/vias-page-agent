<!DOCTYPE html>
<html lang="zh-CN" data-zcode-design>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vias 页面助手</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #20242b;
    --ink-strong: #13171d;
    --page: #ffffff;
    --bg: #f4f5f7;
    --line: #dce0e5;
    --line-soft: #eceff2;
    --muted: #5a6470;
    --fail: #b4332c;
    --mark: #e4e4e7;
    --mark-ink: #20242b;
    --pre-bg: #191d22;
    --pre-ink: #e6e9ee;
    --radius-sm: 4px;
    --radius: 6px;
    --radius-lg: 8px;
    --border: 1.5px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-6: 24px;
    --space-8: 32px;
    --gutter: 16px;
    --font-body: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    --font-title: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    --font-code: "Cascadia Code", Consolas, monospace;
    --text-small: 12px;
    --text-control: 13px;
    --text-body: 14px;
    --text-title: 18px;
    --layer-header: 10;
    --layer-menu: 20;
    --layer-toast: 30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e6e9ee;
      --ink-strong: #f4f6f8;
      --page: #191d22;
      --bg: #13161a;
      --line: #343b45;
      --line-soft: #242a32;
      --muted: #abb3bf;
      --fail: #ff9f95;
      --mark: #343b45;
      --mark-ink: #e6e9ee;
      --pre-bg: #0f1216;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; min-width: 0; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: var(--ink);
    background: var(--page);
    font: var(--text-body)/1.65 var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  a:focus-visible, pre:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 1px;
  }
  button:focus-visible { border-color: var(--ink); }
  button:not(:disabled):active { opacity: .78; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0;
  }

  /* A fixed command area keeps task controls separate from conversation content. */
  .app-header {
    flex: none; display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-2) var(--gutter);
    background: var(--page); z-index: var(--layer-header);
  }
  .brand { display: flex; align-items: baseline; gap: var(--space-2); margin-right: auto; min-width: 0; font: 650 17px/1.4 var(--font-title); }
  .brand small { color: var(--muted); font: 400 var(--text-small)/1.4 var(--font-body); white-space: nowrap; }
  .header-actions { display: flex; gap: var(--space-1); flex: none; }
  .icon-btn {
    min-width: 44px; min-height: 44px; padding: var(--space-2);
    border: 1px solid transparent; border-radius: var(--radius-sm);
    background: transparent; color: var(--muted); font-size: var(--text-small);
  }
  .icon-btn:hover:not(:disabled) { color: var(--ink); background: var(--line-soft); }
  .context-bar {
    display: flex; align-items: center; gap: var(--space-3); flex: none;
    padding: 0 var(--gutter) var(--space-2);
    border-bottom: var(--border) solid var(--line); background: var(--page);
  }
  #modelPill {
    flex: 0 1 auto; min-width: 0; margin-right: auto;
    min-height: 44px; padding: var(--space-2) var(--space-3);
    max-width: min(320px, calc(100vw - 144px));
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: left; border: var(--border) solid var(--line); border-radius: var(--radius-sm);
    background: var(--page); color: var(--ink); font-size: var(--text-control); font-weight: 600;
  }
  #modelPill:hover:not(:disabled) { border-color: var(--muted); background: var(--bg); }
  #modelPill[aria-expanded="true"] { border-color: var(--ink); }
  .seg { display: flex; flex: none; padding: 0; border: var(--border) solid var(--line); border-radius: var(--radius-sm); background: var(--bg); }
  .seg button {
    min-width: 44px; min-height: 44px; padding: var(--space-2);
    border: 0; border-radius: 0; background: transparent; color: var(--muted);
    font-size: var(--text-small); white-space: nowrap;
  }
  .seg button:first-child { border-radius: 3px 0 0 3px; }
  .seg button:last-child { border-radius: 0 3px 3px 0; }
  .seg button.on { background: var(--ink); color: var(--page); font-weight: 600; }
  .seg button:focus-visible { position: relative; z-index: 1; outline: 0; box-shadow: inset 0 0 0 2px var(--ink); }
  .seg button.on:focus-visible { box-shadow: inset 0 0 0 2px var(--page); }

  .conversation { flex: 1; min-height: 0; display: flex; position: relative; }
  #chat {
    flex: 1; min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden;
    overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    padding: var(--space-6) var(--gutter);
    display: flex; flex-direction: column; gap: var(--space-6);
  }
  .empty-state { display: none; position: absolute; inset: 0; pointer-events: none; padding: var(--space-8) var(--gutter) var(--space-6); }
  .conversation:has(#chat:empty) .empty-state { display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; }
  .empty-state h1 { margin: 0 0 var(--space-2); font: 600 var(--text-title)/1.4 var(--font-title); color: var(--ink-strong); }
  .empty-state p { margin: 0; max-width: 32ch; color: var(--muted); font-size: var(--text-control); line-height: 1.8; }
  .msg { flex: none; min-width: 0; max-width: 100%; font-size: var(--text-body); }
  .msg.user {
    align-self: flex-end; width: calc(100% - var(--space-6));
    padding: var(--space-3) var(--space-4);
    border: var(--border) solid var(--line-soft); border-radius: var(--radius-lg);
    background: var(--bg); color: var(--ink);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.ai { align-self: stretch; padding: 0; background: transparent; }
  .msg.sys { align-self: stretch; color: var(--muted); font-size: var(--text-small); line-height: 1.7; overflow-wrap: anywhere; }

  .tools {
    flex: none; align-self: stretch; min-width: 0; max-width: 100%;
    border: var(--border) solid var(--line); border-radius: var(--radius);
    padding: var(--space-2) var(--space-3); background: var(--page);
    font-size: var(--text-small); line-height: 1.6;
  }
  .tools-head { color: var(--muted); padding: var(--space-1) 0; margin-bottom: var(--space-1); }
  .tool { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: var(--space-1) var(--space-2); align-items: start; padding: var(--space-2) 0; min-width: 0; }
  .tool + .tool { border-top: 1px solid var(--line-soft); }
  .tool-name { font: 600 var(--text-small)/1.6 var(--font-code); color: var(--ink); white-space: nowrap; }
  .tool-detail { color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
  .tool-state { max-width: min(120px, 24vw); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .tool.pending .tool-state { color: var(--muted); }
  .tool.uncertain .tool-state, .tool.skipped .tool-state, .tool.not-executed .tool-state { color: var(--muted); }
  .tool.ok .tool-state { color: var(--ink); }
  .tool.fail .tool-state { color: var(--fail); }
  .tool-reason { grid-column: 1 / -1; color: var(--fail); overflow-wrap: anywhere; }
  .tool.uncertain .tool-reason, .tool.skipped .tool-reason, .tool.not-executed .tool-reason { color: var(--muted); }
  .tool-reason[hidden] { display: none; }

  #status {
    display: none; flex: none; min-height: 36px; align-items: center;
    padding: var(--space-2) var(--gutter); border-top: var(--border) solid var(--line);
    color: var(--muted); background: var(--bg); font-size: var(--text-small); overflow-wrap: anywhere;
  }
  #status.show { display: flex; }
  footer { flex: none; padding: var(--space-3) var(--gutter) var(--space-4); border-top: var(--border) solid var(--line); background: var(--page); }
  #chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-2); }
  .chip {
    min-width: 0; min-height: 44px; padding: var(--space-2);
    border: var(--border) solid var(--line); border-radius: var(--radius-sm);
    background: var(--page); color: var(--muted); font-size: var(--text-small); white-space: nowrap;
  }
  .chip:hover:not(:disabled) { color: var(--ink); background: var(--bg); border-color: var(--muted); }
  .ai-input-form {
    display: flex; align-items: flex-end; gap: var(--space-2); margin-top: var(--space-2);
    border: var(--border) solid var(--line); border-radius: var(--radius); padding: var(--space-2); background: var(--page);
  }
  .ai-input-form:focus-within { border-color: var(--ink); }
  #input {
    display: block; flex: 1; min-width: 0; height: 22px; max-height: 132px;
    padding: 11px var(--space-1); border: 0; outline: 0; background: transparent; color: var(--ink);
    font: var(--text-body)/22px var(--font-body); resize: none; overflow-y: hidden; box-sizing: content-box;
  }
  #input::placeholder { color: var(--muted); opacity: 1; }
  #send {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 56px; height: 44px; padding: var(--space-2);
    border: var(--border) solid var(--ink); border-radius: var(--radius-sm);
    background: var(--ink); color: var(--page); font-size: var(--text-control); font-weight: 600;
  }
  #send[aria-label="停止"] { border-color: var(--fail); background: var(--page); color: var(--fail); }
  #send:focus-visible { outline: 0; box-shadow: inset 0 0 0 2px var(--page); }
  #send[aria-label="停止"]:focus-visible { box-shadow: inset 0 0 0 2px var(--ink); }

  .model-menu {
    position: fixed; display: none; z-index: var(--layer-menu);
    width: max-content; min-width: 150px; max-width: 240px; padding: var(--space-1);
    border: var(--border) solid var(--line); border-radius: var(--radius);
    background: var(--page); box-shadow: 0 8px 24px rgb(32 36 43 / .14);
    overflow-y: auto; overscroll-behavior: contain;
  }
  .model-menu.show { display: block; }
  .model-item {
    position: relative; display: block; width: 100%; min-height: 44px;
    padding: var(--space-3) var(--space-3) var(--space-3) var(--space-8);
    border: 0; border-radius: var(--radius-sm); text-align: left;
    background: transparent; color: var(--ink); font: var(--text-control)/1.5 var(--font-body);
    white-space: normal; overflow-wrap: anywhere;
  }
  .model-item:hover, .model-item:focus-visible { background: var(--line-soft); }
  .model-item.on { color: var(--ink); background: var(--line-soft); font-weight: 600; }
  .model-item.on::before { content: ''; position: absolute; left: 14px; top: 16px; width: 5px; height: 9px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); }
  .model-item.manage { margin-top: var(--space-1); border-top: 1px solid var(--line); border-radius: 0; color: var(--muted); }
  .copy-toast {
    position: fixed; top: var(--space-3); left: 50%; z-index: var(--layer-toast);
    max-width: calc(100vw - 32px); padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-sm); background: var(--ink); color: var(--page);
    font-size: var(--text-small); opacity: 0; pointer-events: none;
    transform: translateX(-50%) translateY(-4px);
    transition: opacity 120ms ease, transform 120ms ease;
  }
  .copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .md-content { font-size: var(--text-body); line-height: 1.8; overflow-wrap: anywhere; }
  .md-content > *:first-child { margin-top: 0; }
  .md-content > *:last-child { margin-bottom: 0; }
  .md-content h1, .md-content h2, .md-content h3, .md-content h4, .md-content h5, .md-content h6 { color: var(--ink-strong); font-weight: 650; line-height: 1.4; margin: var(--space-4) 0 var(--space-2); }
  .md-content h1 { font-size: 22px; }
  .md-content h2 { font-size: 18px; }
  .md-content h3 { font-size: 16px; }
  .md-content h4 { font-size: 14px; }
  .md-content h5 { font-size: 13px; }
  .md-content h6 { font-size: 12px; color: var(--muted); }
  .md-content p { margin: 0 0 var(--space-3); }
  .md-content ul, .md-content ol { margin: 0 0 var(--space-3); padding-left: var(--space-6); }
  .md-content li { margin: var(--space-1) 0; }
  .md-content li > p { margin: 0; display: inline; }
  .md-content li::marker { color: var(--muted); }
  .md-content blockquote { margin: var(--space-3) 0; padding: var(--space-2) var(--space-3); border-inline-start: 2px solid var(--line); color: var(--muted); }
  .md-content pre {
    margin: var(--space-3) 0; padding: var(--space-4);
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--pre-bg); color: var(--pre-ink);
    overflow-x: auto; font: 12px/1.7 var(--font-code); cursor: pointer;
  }
  .md-content pre code { padding: 0; margin: 0; border: 0; background: transparent; color: inherit; cursor: pointer; }
  .md-content code { padding: 1px var(--space-1); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg); font: 12px/1.7 var(--font-code); cursor: pointer; }
  .table-scroll { max-width: 100%; overflow-x: auto; margin: var(--space-3) 0; }
  .md-content table { width: 100%; margin: 0; border-collapse: collapse; font-size: var(--text-control); }
  .md-content th, .md-content td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  .md-content th { background: var(--bg); font-weight: 600; }
  .md-content tr:last-child td { border-bottom: 0; }
  .md-content hr { height: 1px; margin: var(--space-4) 0; border: 0; border-top: 1px solid var(--line); }
  .md-content a { color: var(--ink); text-underline-offset: 3px; }
  .md-content mark { --ink: var(--mark-ink); --ink-strong: var(--mark-ink); --line-soft: transparent; --bg: transparent; --line: transparent; background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 var(--space-1); }
  .md-content mark a { color: var(--mark-ink); }
  .md-content strong { font-weight: 650; color: var(--ink-strong); }
  .md-content li:has(> .task-checkbox) { list-style: none; display: flex; align-items: center; gap: var(--space-2); margin: var(--space-1) 0; }
  .md-content li:has(> .task-checkbox)::marker { content: ''; }
  .md-content .task-checkbox { flex: none; width: 16px; height: 16px; border: 1.5px solid var(--muted); border-radius: 3px; }
  .md-content .task-checkbox.checked { position: relative; background: var(--ink); border-color: var(--ink); }
  .md-content .task-checkbox.checked::after { content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid var(--page); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }

  @media (min-width: 800px) { :root { --gutter: max(24px, calc((100vw - 760px) / 2)); } }
  @media (max-width: 340px) { .brand small { display: none; } .context-bar { gap: var(--space-2); } }
  @media (prefers-reduced-motion: reduce) { .copy-toast { transition: none; } }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">Vias<small>页面助手</small></div>
  <div class="header-actions">
    <button id="clear" class="icon-btn" title="新建对话">新建</button>
    <button id="gear" class="icon-btn" title="设置">设置</button>
  </div>
</header>
<div class="context-bar" aria-label="任务设置">
  <button id="modelPill" title="切换模型">加载中…</button>
  <div class="seg" role="group" aria-label="工作模式">
    <button id="modeAsk" aria-pressed="false" title="只读当前页面回答，不执行任何操作">问答</button>
    <button id="modeAgent" class="on" aria-pressed="true" title="AI 可操作当前页面（点击、填写、提交）">执行</button>
  </div>
</div>
<main class="conversation" aria-label="对话与操作记录">
  <div id="chat" role="log" aria-live="polite" aria-relevant="additions"></div>
  <section class="empty-state">
    <h1>从当前页面开始</h1>
    <p>阅读、整理内容，或执行点击与填写。输入任务，也可以选择下方快捷指令。</p>
  </section>
</main>
<div id="status" role="status" aria-live="polite"></div>
<footer>
  <div id="chips" aria-label="快捷指令"></div>
  <form class="ai-input-form" id="inputForm">
    <textarea id="input" rows="1" placeholder="描述要完成的任务…" aria-label="输入任务"></textarea>
    <button id="send" type="submit" title="发送" aria-label="发送">发送</button>
  </form>
</footer>
<div class="copy-toast" id="copyToast" role="status" aria-live="polite">已复制</div>
<div class="model-menu" id="modelMenu" role="menu" aria-label="模型列表"></div>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="core.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
