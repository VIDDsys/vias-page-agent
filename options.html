<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Vias 页面助手 - 设置</title>
<style>
  :root { color-scheme: light dark; --ink: #111; --page: #fff; --bg: #fafafa; --line: #e5e7eb; --line-soft: #f1f2f4; --muted: #8a8f98; --ok: #107c10; --fail: #c42b1c; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f4f4f5; --page: #1c1c1f; --bg: #161618; --line: #2e2e33; --line-soft: #26262b; --muted: #7c7f87; }
  }
  * { box-sizing: border-box; }
  body { font: 14px/1.7 "Segoe UI", "Microsoft YaHei", sans-serif; max-width: 660px; margin: 40px auto; padding: 0 16px; color: var(--ink); background: var(--bg); }
  h1 { font-size: 18px; }
  h2 { font-size: 15px; margin: 26px 0 8px; }
  .card { background: var(--page); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin: 10px 0; }
  .card.active { border-color: var(--ink); box-shadow: 0 6px 20px rgba(0,0,0,.06); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row strong { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tag, .row button { flex: none; }
  .meta { color: var(--muted); font-size: 12px; word-break: break-all; margin-top: 4px; }
  label { display: block; margin-top: 12px; font-weight: 600; font-size: 13px; }
  input, textarea { width: 100%; padding: 8px 10px; margin-top: 4px; border-radius: 8px; border: 1px solid var(--line); font: inherit; background: var(--page); color: inherit; }
  input[type="checkbox"] { width: auto; margin-right: 8px; }
  textarea { height: 96px; resize: vertical; }
  button { padding: 7px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--page); color: var(--ink); cursor: pointer; font: inherit; font-size: 13px; }
  button.primary { background: var(--ink); color: var(--page); border-color: var(--ink); }
  button.danger { color: var(--fail); }
  button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .form-title-row { display: flex; align-items: baseline; gap: 10px; }
  .form-title-row h2 { margin-right: auto; }
  .promote-link { font-size: 13px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
  .key-row { display: flex; gap: 8px; margin-top: 4px; }
  .key-row input { flex: 1; min-width: 0; margin-top: 0; }
  .eye-btn { flex: none; width: 42px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--muted); }
  .eye-btn:hover { color: var(--ink); }
  .status { font-size: 12px; }
  .ok { color: var(--ok); }
  .fail { color: var(--fail); }
  #formWrap { display: none; }
  #formWrap.show { display: block; }
  .tag { font: inherit; font-size: 13px; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; background: var(--page); }
</style>
</head>
<body>
<h1>Vias 页面助手 · 设置</h1>
<p class="hint">配置一个或多个模型（任意 OpenAI 兼容接口：官方 API、中转站、本地模型均可），配置后在侧边栏可随时切换。所有配置仅保存在本机浏览器内（不上云同步），卸载扩展即自动清除。</p>

<h2>模型列表</h2>
<div id="modelList"></div>
<div class="row" style="margin-top:12px">
  <button id="btnAdd" class="primary">＋ 添加模型</button>
</div>

<div id="formWrap" class="card">
  <div class="form-title-row">
    <h2 id="formTitle" style="margin-top:0">添加模型</h2>
    <a class="promote-link" href="https://api.viddsys.xyz/" target="_blank" rel="noopener noreferrer">打开VIDDsys API</a>
  </div>
  <label for="fName">显示名称（侧边栏切换菜单里显示的名字）</label>
  <input id="fName" autocomplete="off" placeholder="VIDDsys API">
  <label for="fBase">API 地址（Base URL）</label>
  <input id="fBase" type="url" autocomplete="url" placeholder="https://api.viddsys.xyz/v1">
  <label for="fKey">API Key</label>
  <div class="key-row">
    <input id="fKey" type="password" autocomplete="new-password" placeholder="sk-******key">
    <button id="toggleKey" type="button" class="eye-btn" title="显示密钥" aria-label="显示密钥" aria-pressed="false"></button>
  </div>
  <label for="fModel">模型名</label>
  <input id="fModel" autocomplete="off" placeholder="deepseek-v4.1-flash">
  <label><input id="fVision" type="checkbox" style="width:auto;margin-right:8px">允许向模型发送页面图片</label>
  <div class="row" style="margin-top:16px">
    <button id="btnSave" class="primary">保存</button>
    <button id="btnCancel">取消</button>
    <span id="formStatus" class="status" role="status" aria-live="polite"></span>
  </div>
</div>

<h2><label for="systemPrompt">系统提示词（全局，对所有模型生效）</label></h2>
<textarea id="systemPrompt" placeholder="留空使用默认提示词"></textarea>
<div class="row" style="margin-top:10px">
  <button id="btnSavePrompt" class="primary">保存提示词</button>
  <span id="promptStatus" class="status" role="status" aria-live="polite"></span>
</div>
<section id="promptConflict" class="card" hidden aria-label="提示词冲突恢复">
  <p>设置已更新，未保存的草稿仍保留在上方。请对照下方最新提示词，按需合并到草稿，再点击「保留草稿并继续」后重新保存；不会自动覆盖其他窗口。</p>
  <label for="latestPrompt">最新已保存的提示词（只读）</label>
  <textarea id="latestPrompt" readonly></textarea>
  <button id="btnRebasePrompt" type="button">保留草稿并继续</button>
</section>

<script src="core.js"></script>
<script src="options.js"></script>
</body>
</html>
